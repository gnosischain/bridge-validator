name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Default to read-only; elevate per-job only where required (the release job).
permissions:
  contents: read

# One release per tag; never cancel a release mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1) Create the GitHub Release for the pushed tag.
  release:
    name: create github release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # only this job needs write to create the release
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
              draft: false,
              prerelease: false,
            });

  # 2) Build & push the multi-arch production image to Docker Hub.
  #
  # Uses Docker's official GitHub Builder reusable workflow. With distribute:true
  # (its default) each platform builds on its own NATIVE runner — arm64 maps to
  # ubuntu-24.04-arm — so there's no QEMU emulation (the old bottleneck). It also
  # emits signed SLSA provenance (needs id-token: write), an SBOM, and uses the
  # signed GitHub Actions cache.
  docker:
    name: build & push image
    needs: release
    permissions:
      contents: read
      id-token: write          # required for signed SLSA provenance attestation
    uses: docker/github-builder/.github/workflows/build.yml@70ac3fc303efa83d2b94905e6ab78bb83cbdc2ae # v1.11.0
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      file: ./bridge_validator/Dockerfile
      context: .
      cache: true
      cache-mode: max
      sbom: true
      set-meta-labels: true
      # env context isn't available in a reusable-call `with:`, so the image name
      # is inlined here. The three tags reproduce the previous set exactly:
      #   {{version}} -> 1.2.3 (metadata-action strips the leading v)
      #   ref/tag     -> v1.2.3 (literal git tag)
      #   raw         -> latest
      meta-images: gnosischain/bridge-validator
      meta-tags: |
        type=semver,pattern={{version}}
        type=ref,event=tag
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_ACCESS_TOKEN_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN_SECRET }}

  # 3) Record the (commit -> digest) binding for lightweight verification.
  # Own job because `docker` calls a reusable workflow and cannot run `steps:`.
  # The digest is the pushed multi-arch INDEX digest — the same value
  # `docker buildx imagetools inspect --format '{{.Manifest.Digest}}'` returns.
  record-binding:
    name: record release binding
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write          # gh release edit
    steps:
      - name: Record release binding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:    ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          DIGEST: ${{ needs.docker.outputs.digest }}
          IMAGE:  gnosischain/bridge-validator
          REPO:   ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "$DIGEST" ]]; then
            echo "::error::No digest emitted by build step — aborting." >&2
            exit 1
          fi

          # 1. Workflow run summary (visible on the Actions tab)
          {
            echo "## Release binding"
            echo
            echo "| field  | value |"
            echo "|--------|-------|"
            echo "| tag    | \`$TAG\` |"
            echo "| commit | \`$COMMIT\` |"
            echo "| image  | \`$IMAGE:$TAG\` |"
            echo "| digest | \`$DIGEST\` |"
            echo
            echo "Verify locally:"
            echo
            echo '```bash'
            echo "ACTUAL=\$(docker buildx imagetools inspect $IMAGE:$TAG --format '{{.Manifest.Digest}}')"
            echo "[ \"\$ACTUAL\" = \"$DIGEST\" ] && echo match || echo MISMATCH"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # 2. Durable: append the binding to the GitHub Release body
          NOTES=$(cat <<EOF

          ---

          **Published image**

          - image:  \`$IMAGE:$TAG\`
          - digest: \`$DIGEST\`
          - commit: \`$COMMIT\`

          Verify (one command, no rebuild):
          \`\`\`
          docker buildx imagetools inspect $IMAGE:$TAG --format '{{.Manifest.Digest}}'
          \`\`\`
          The output should equal the digest above.
          EOF
          )
          EXISTING=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)
          printf '%s\n%s\n' "$EXISTING" "$NOTES" | gh release edit "$TAG" --repo "$REPO" --notes-file -

  # 4) Notify Slack (always runs so failures are reported too).
  notify:
    name: notify slack
    needs: [release, docker, record-binding]
    if: always()
    uses: ./.github/workflows/slack_release_notification.yml
    with:
      service: Bridge Validator
      environment: Production
      success: ${{ needs.release.result == 'success' && needs.docker.result == 'success' && needs.record-binding.result == 'success' }}
      message: >-
        Released `Bridge Validator` version `${{ github.ref_name }}` from commit
        `${{ github.sha }}`. Triggered by `${{ github.actor }}`. Image digest:
        `${{ needs.docker.outputs.digest }}`. Docker Hub:
        https://hub.docker.com/r/gnosischain/bridge-validator/tags?name=${{ github.ref_name }}
    # Pass only the secret the reusable workflow needs (least privilege),
    # rather than `secrets: inherit` which would forward all caller secrets.
    secrets:
      RELEASES_SLACK_WEBHOOK_URL: ${{ secrets.RELEASES_SLACK_WEBHOOK_URL }}
